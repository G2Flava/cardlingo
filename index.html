<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>CardLingo · 角色卡翻译器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark">
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="菜单">☰</button>
      <div class="brand"><span class="brand-mark">🍺</span><strong>CardLingo</strong></div>
      <div class="top-actions">
        <button id="openSettings" class="ghost-btn">API 设置</button>
        <button id="themeToggle" class="icon-btn" aria-label="切换主题">◐</button>
      </div>
    </header>

    <main>
      <section id="dropzone" class="landing" tabindex="0">
        <input id="fileInput" type="file" accept=".png,.json,.charx,application/json,image/png" hidden />
        <div class="landing-card">
          <div class="landing-icon">↗</div>
          <h1>导入角色卡</h1>
          <p>支持 PNG / JSON / CHARX，自动识别 Character Card V1 / V2 / V3。</p>
          <button id="chooseFile" class="primary-btn">选择角色卡</button>
          <div class="format-row"><span>PNG</span><span>JSON</span><span>CHARX</span><span>V1—V3</span></div>
        </div>
      </section>

      <section id="workspace" class="workspace hidden">
        <div class="card-summary">
          <div class="avatar-wrap"><img id="avatar" alt="角色卡头像" /></div>
          <div class="summary-copy"><div class="tiny-label">CURRENT CARD</div><h2 id="cardName">未命名角色</h2><p id="cardSpec">—</p></div>
          <div class="summary-meta"><span id="fileTypeChip">—</span><span id="fieldCountChip">0 字段</span></div>
          <div class="summary-actions"><button id="replaceFile" class="small-btn">更换</button><button id="resetCard" class="small-btn danger-text">清空</button></div>
        </div>

        <div class="content-head">
          <nav class="main-tabs" aria-label="主页面">
            <button class="main-tab active" data-page="role">角色</button>
            <button class="main-tab" data-page="book">角色书</button>
          </nav>
          <button id="translateCurrent" class="translate-all-btn">一键翻译</button>
        </div>

        <section id="page-role" class="page-panel active">
          <div id="fieldList" class="field-list expanded-fields"></div>
        </section>

        <section id="page-book" class="page-panel">
          <div id="bookEmpty" class="book-empty hidden">
            <div class="book-icon">▤</div>
            <p>当前角色卡没有角色书</p>
            <button id="createBook" class="primary-btn compact">创建角色书</button>
          </div>
          <div id="bookList" class="field-list expanded-fields"></div>
        </section>

        <section id="exportPanel" class="download-strip hidden">
          <button id="quickDownload" class="primary-btn">一键下载中文版</button>
          <button id="exportOriginalFormat" class="secondary-btn">导出原格式</button>
          <button id="exportJson" class="secondary-btn">导出 JSON</button>
          <button id="quickDownloadBottom" class="secondary-btn hidden">下载</button>
          <span id="exportHint">保留原格式，原始文件不会被修改。</span>
        </section>
      </section>
    </main>
  </div>

  <dialog id="settingsDialog" class="modal">
    <form method="dialog" class="modal-card" id="settingsForm">
      <div class="modal-head"><div><div class="tiny-label">SETTINGS</div><h2>API 与翻译设置</h2></div><button value="cancel" class="close-btn">×</button></div>
      <div class="modal-body">
        <label class="field"><span>快速预设</span><select id="providerPreset"><option value="deepseek-flash">DeepSeek V4 Flash</option><option value="deepseek-pro">DeepSeek V4 Pro</option><option value="openai-compatible">OpenAI 兼容 / 自定义</option></select></label>
        <label class="field"><span>API 密钥</span><div class="input-inline"><input id="apiKey" type="password" autocomplete="off" placeholder="sk-…" /><button type="button" id="toggleKey" class="micro-btn">显示</button></div></label>
        <label class="check-line"><input id="rememberKey" type="checkbox" /> <span>在此浏览器保存 API Key</span></label>
        <label class="field"><span>基础 URL</span><input id="baseUrl" value="https://api.deepseek.com" /></label>
        <label class="field"><span>模型名称</span><input id="modelName" value="deepseek-v4-flash" /></label>
        <div class="field"><span>API 协议</span><div class="radio-row"><label><input type="radio" name="protocol" value="chat" checked /> Chat Completions</label><label><input type="radio" name="protocol" value="responses" /> Responses API</label></div></div>
        <div class="two-col"><label class="field"><span>源语言</span><select id="sourceLang"><option value="auto">自动识别</option><option value="en">英文</option><option value="ja">日文</option><option value="ko">韩文</option><option value="zh">中文</option></select></label><label class="field"><span>目标语言</span><select id="targetLang"><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="en">英文</option><option value="ja">日文</option><option value="ko">韩文</option></select></label></div>
        <div id="translationOptions" class="check-grid"></div>
        <button type="button" id="selectSafe" class="micro-btn">恢复推荐翻译范围</button>
        <label class="field"><span>自定义不可翻译词</span><textarea id="customProtected" rows="3" placeholder="每行一个"></textarea></label>
        <label class="field"><span>额外翻译要求</span><textarea id="extraPrompt" rows="3" placeholder="例如：人名保留英文"></textarea></label>
        <div class="two-col"><label class="field"><span>每批最大字符</span><input id="batchChars" type="number" value="12000" /></label><label class="field"><span>并发请求</span><input id="concurrency" type="number" value="2" min="1" max="5" /></label></div>
        <div class="two-col"><label class="field"><span>Temperature</span><input id="temperature" type="number" min="0" max="2" step="0.05" value="0.2" /></label><label class="field"><span>超时（秒）</span><input id="timeoutSec" type="number" min="15" max="300" value="120" /></label></div>
        <label class="check-line"><input id="nonThinking" type="checkbox" checked /> <span>请求非思考模式（服务支持时）</span></label>
        <div id="progressWrap" class="progress-wrap hidden"><div class="progress-top"><span id="progressText">准备中…</span><strong id="progressPercent">0%</strong></div><div class="progress-bar"><i id="progressBar"></i></div></div>
        <div class="modal-tool-row"><button type="button" id="testApi" class="secondary-btn">测试 API</button><button type="button" id="cancelTranslate" class="secondary-btn danger-text hidden">停止翻译</button></div>
      </div>
      <div class="modal-foot"><button value="cancel" class="secondary-btn">取消</button><button id="saveSettings" value="default" class="primary-btn compact">保存设置</button></div>
    </form>
  </dialog>

  <div class="hidden-utilities" aria-hidden="true">
    <button id="startTranslate"></button><button id="translateAllVisible"></button><input id="fieldSearch" /><button id="showChanged"></button>
    <textarea id="jsonEditor"></textarea><button id="copyJson"></button><button id="applyJson"></button><pre id="logBox">等待载入角色卡…</pre>
  </div>
  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
